# Baseline configuration
# No memory, curiosity or ML-Agents self-play

behaviors:
  AirHockeyBrain:
    trainer_type: ppo

    hyperparameters:
      batch_size: 2048
      buffer_size: 32768
      learning_rate: 3.0e-4
      learning_rate_schedule: linear

      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 4

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0

    keep_checkpoints: 10000
    checkpoint_interval: 500000

    max_steps: 50000000
    time_horizon: 256
    summary_freq: 50000